{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d1a">
    <title>Offline - MindVault</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="offline-container">
        <p class="offline-label">Connection unavailable</p>
        <h1>You're offline.</h1>
        <p class="offline-copy">
            MindVault can show cached pages, but new changes are not saved while you're offline.
            Copy any unsaved writing before leaving this page.
        </p>
        <p class="offline-status" id="connection-status" role="status">
            Reconnect to continue working with your vault.
        </p>
        <button class="btn btn-primary" id="retry-connection" type="button">Try again</button>
    </main>
    <script>
        const status = document.getElementById('connection-status');
        const retryButton = document.getElementById('retry-connection');

        retryButton.addEventListener('click', () => window.location.reload());
        window.addEventListener('online', () => {
            status.textContent = 'Connection restored. Try loading MindVault again.';
        });
    </script>
</body>
</html>

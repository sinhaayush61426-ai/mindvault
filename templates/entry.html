{% extends "base.html" %}

{% block title %}Edit - {{ entry.title }} - MindVault{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width: 900px;">
        <h1 class="section-title gradient-text" style="margin-bottom: 2rem;">Edit Entry</h1>

        <div class="glass-panel form-card">
            <form action="{% url 'edit_entry' entry_id=entry.id %}" method="POST" data-autosave-url="{% url 'autosave_entry' %}" data-entry-id="{{ entry.id }}">
                {% csrf_token %}
                <div class="form-field">
                    <label class="visually-hidden" for="entry-title">Entry title</label>
                    <input class="entry-title-input" id="entry-title" type="text" name="title" value="{{ entry.title }}" placeholder="Entry title..." maxlength="100" required>
                </div>

                <div class="form-field">
                    <label for="category">Category</label>
                    <div class="custom-select">
                        <select name="category" id="category">
                            <option value="General" {% if entry.category == 'General' %}selected{% endif %}>General</option>
                            <option value="Novella" {% if entry.category == 'Novella' %}selected{% endif %}>Novella/Fiction</option>
                            <option value="Research" {% if entry.category == 'Research' %}selected{% endif %}>Science Research</option>
                        </select>
                    </div>
                </div>

                <div class="form-field">
                    <label class="visually-hidden" for="entry-content">Entry content</label>
                    <textarea id="entry-content" name="content" placeholder="Update your entry..." maxlength="1000000" required>{{ content }}</textarea>
                </div>

                <div class="submit-block entry-actions">
                    <button id="zen-toggle" type="button" class="btn btn-secondary">Focus mode</button>
                    <button type="submit" class="btn btn-primary">
                        <svg class="icon icon-sm icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"></path>
                        </svg>
                        Save Changes
                    </button>
                    <a href="{% url 'view_entry' entry_id=entry.id %}" class="btn btn-secondary" style="text-decoration: none;">
                        Cancel
                    </a>
                </div>
                <p class="autosave-status" id="save-indicator" role="status" aria-live="polite">Automatic saves require a connection; entry text is encrypted before storage.</p>
            </form>
        </div>
    </div>
</section>
{% endblock %}
